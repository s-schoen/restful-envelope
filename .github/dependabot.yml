version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      typescript-oxlint:
        dependency-type: development
        patterns:
          - typescript
          - oxlint
          - oxlint-tsgolint
      development-tools:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - typescript
          - oxlint
          - oxlint-tsgolint
      runtime-dependencies:
        dependency-type: production
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
