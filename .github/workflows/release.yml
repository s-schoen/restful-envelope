name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tooling
          persist-credentials: false
          sparse-checkout: scripts

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Validate release metadata
        id: package
        run: bash .tmp/release-tooling/scripts/validate-release.sh

      - name: Check npm version order
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: bash .tmp/release-tooling/scripts/check-npm-version.sh "$PACKAGE_NAME" "$PACKAGE_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Pack release artifact
        run: pnpm pack --pack-destination artifacts

      - name: Validate release artifact
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: bash .tmp/release-tooling/scripts/validate-release-artifact.sh artifacts "$PACKAGE_NAME" "$PACKAGE_VERSION"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.verify.outputs.package_name }}/v/${{ needs.verify.outputs.package_version }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: artifacts

      - name: Recheck npm version order
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: bash scripts/check-npm-version.sh "$PACKAGE_NAME" "$PACKAGE_VERSION"

      - name: Publish to npm
        run: bash scripts/publish-release.sh artifacts
