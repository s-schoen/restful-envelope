codecov:
  strict_yaml_branch: master
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
        if_not_found: failure

    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
        if_not_found: failure

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: "coverage_drop OR uncovered_patch"

github_checks:
  annotations: false
